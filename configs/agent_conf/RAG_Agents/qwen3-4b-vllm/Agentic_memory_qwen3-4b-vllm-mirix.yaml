agent_name: Agentic_memory_mirix
model: Qwen/Qwen3-4B-Instruct-2507
tokenizer_model: Qwen/Qwen3-4B-Instruct-2507
provider: openai_compatible
api_base: http://127.0.0.1:8000/v1
api_key: EMPTY
temperature: 0.7
input_length_limit: 262144
buffer_length: 5000
output_dir: ./outputs/qwen3-4b-vllm-mirix

retrieve_num: 10
agent_chunk_size: 4096

mirix_use_controller: true
mirix_use_extractor: true
mirix_max_extracted_memories: 8
mirix_extraction_max_tokens: 512
mirix_controller_max_tokens: 160
mirix_max_context_chars: 24000
